<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment Dashboard Pro</title>
    <style>
        :root {
            --bg-base-color: #4cbb17;
            --bg-opacity: 0.7;
            --text-color: #ffffff;
            --font-family: sans-serif;
            --font-base-size: 2vw;
            --content-bg: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: var(--font-family);
            color: var(--text-color);
        }

        #bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        #background-logo {
            position: absolute;
            z-index: -2;
            pointer-events: none;
            display: none;
        }

        #main-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            z-index: 1;
            position: relative;
        }

        /* Full Screen Button Styling */
        #fs-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid white;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            z-index: 10;
        }

        #fs-toggle:hover {
            background: rgba(0, 0, 0, 0.5);
        }

        #top-section {
            height: 80vh;
            padding: 20px 20px 0 20px;
            display: flex;
            flex-direction: column;
        }

        .tab-bar {
            display: flex;
            justify-content: center;
            gap: 0;
        }

        .tab-btn {
            padding: 12px 30px;
            font-size: calc(var(--font-base-size) * 0.8);
            cursor: pointer;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-bottom: none;
            color: inherit;
            border-radius: 10px 10px 0 0;
            transition: background 0.3s;
            font-family: inherit;
        }

        .tab-btn.active {
            background: var(--content-bg);
            color: #333;
            border: 1px solid #ccc;
            border-bottom: none;
            position: relative;
            top: 1px;
            z-index: 2;
        }

        .tab-content {
            flex-grow: 1;
            display: none;
            background: var(--content-bg);
            border: 1px solid #ccc;
            border-radius: 0 0 10px 10px;
            padding: 30px;
            font-size: var(--font-base-size);
            overflow-y: auto;
            color: #333;
        }

        .tab-content.active {
            display: block;
        }

        #bottom-section {
            height: 20vh;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: calc(var(--font-base-size) * 1.5);
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            font-size: 0.9rem;
        }

        textarea {
            width: 100%;
            height: 40%;
            margin-top: 5px;
            font-family: inherit;
        }

        .period-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            font-size: 0.7rem;
            gap: 5px;
            margin-top: 10px;
        }

        .timer-box {
            text-align: center;
            flex: 1;
        }

        .timer-label {
            display: block;
            font-size: 0.4em;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div id="bg-overlay"></div>
    <img id="background-logo" src="" alt="Logo">

    <div id="main-container">
        <!-- New Full Screen Button -->
        <button id="fs-toggle" onclick="toggleFullScreen()">Toggle Full Screen</button>
        <div id="bottom-section">
            <div class="timer-box"><span class="timer-label">Start Time</span><span id="display-start">00:00:00</span>
            </div>
            <div class="timer-box"><span class="timer-label">Current</span><span id="display-current">00:00:00</span>
            </div>
            <div class="timer-box"><span class="timer-label">Remaining</span><span id="display-remain">00:00:00</span>
            </div>
            <div class="timer-box"><span class="timer-label">End Time</span><span id="display-end">00:00:00</span></div>
        </div>
        <div id="top-section">
            <div class="tab-bar">
                <button class="tab-btn active" onclick="showTab('paper', event)">Paper Assessment</button>
                <button class="tab-btn" onclick="showTab('online', event)">Online Assessment</button>
                <button class="tab-btn" onclick="showTab('settings', event)">Settings</button>
            </div>

            <div id="paper" class="tab-content active"></div>
            <div id="online" class="tab-content"></div>

            <div id="settings" class="tab-content">
                <div class="settings-grid">
                    <div>
                        <label>Logo URL:</label>
                        <input type="text" id="set-logo-url" style="width:100%" oninput="updateStyles()">
                        <label>Logo Transparency:</label>
                        <input type="range" id="logo-opacity" min="0" max="1" step="0.1" value="0.7"
                            oninput="updateStyles()">
                        <label>Paper Instructions:</label>
                        <textarea id="set-paper-text" rows="10" oninput="updateContent()"></textarea>
                        <label>Online Instructions:</label>
                        <textarea id="set-online-text" rows="10" oninput="updateContent()"></textarea>
                    </div>
                    <div>
                        <label>Select Font & Font Size:</label><br>
                        <select id="set-font" onchange="updateStyles()">
                            <option value="Arial, sans-serif">Arial</option>
                            <option value="'Times New Roman', serif">Times New Roman</option>
                            <option value="'Courier New', monospace">Courier New</option>
                            <option value="Georgia, serif">Georgia</option>
                            <option value="Verdana, sans-serif">Verdana</option>
                            <option value="'Arial Black', sans-serif">Bold Impact</option>
                            <option value="monospace">Monospace</option>
                        </select>
                        <select id="set-size" onchange="updateStyles()">
                            <option value="vw">1</option>
                            <option value="1.2vw">2</option>
                            <option value="1.4vw">3</option>
                            <option value="1.6vw">4</option>
                            <option value="1.8">5</option>
                            <option value="2vw">6</option>
                            <option value="2.2vw">7</option>
                            <option value="2.4vw">8</option>
                            <option value="2.6vw">9</option>
                        </select><br><br>
                        <label>BG Color & Transparency:</label><br>
                        <input type="color" id="set-color" list="presetColors" onchange="updateStyles()">
                        <datalist id="presetColors">
                            <option value="#ffffff"></option>
                            <option value="#000000"></option>
                            <option value="#009639"></option>
                            <option value="#b3a369"></option>
                            <option value="#bbbbbb"></option>
                            <option value="#555555"></option>
                        </datalist>
                        <input type="range" id="set-opacity" min="0" max="1" step="0.1" value="0.7"
                            oninput="updateStyles()"><br><br>
                        <label>Global Text Color:</label><br>
                        <input type="color" id="set-text-color" value="#ffffff" list="presetColors"
                            onchange="updateStyles()"><br><br>
                        <div class="period-options" id="period-radios"></div>
                        <div id="manual-inputs" style="display:none; margin-top:10px;">
                            Start: <input type="time" id="manual-start" step="1">
                            End: <input type="time" id="manual-end" step="1">
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const periods = [
            { name: "Period 1", start: "07:40:00 AM", end: "08:30:00 AM" },
            { name: "Period 2", start: "08:35:00 AM", end: "09:25:00 AM" },
            { name: "Period 3", start: "09:30:00 AM", end: "10:20:00 AM" },
            { name: "Period 4", start: "10:25:00 AM", end: "11:15:00 AM" },
            { name: "Lunch 1", start: "11:45:00 AM", end: "12:35:00 PM" },
            { name: "Lunch 2", start: "12:10:00  PM", end: "1:00:00 PM" },
            { name: "Lunch 3", start: "11:20:00 AM", end: "12:10:00 PM" },
            { name: "Lunch 4", start: "11:45:00 AM", end: "12:35:00 PM" },
            { name: "Period 6", start: "1:05:00 PM", end: "1:55:00 PM" },
            { name: "Period 7", start: "2:00:00 PM", end: "2:50:00 PM" },
            { name: "Manual", start: null, end: null }
        ];

        let activeStartTime = null;
        let activeEndTime = null;

        window.onload = () => {
            renderPeriodRadios();
            loadSettings();
            setInterval(updateTimer, 1000);
        };

        // Full Screen Logic
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable full-screen mode: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function renderPeriodRadios() {
            const container = document.getElementById('period-radios');
            periods.forEach((p, index) => {
                const div = document.createElement('div');
                div.innerHTML = `<input type="radio" name="period" value="${index}" id="p${index}" onchange="setPeriod(${index})">
                                 <label for="p${index}">${p.name}</label>`;
                container.appendChild(div);
            });
        }

        function showTab(tabId, event) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            updateStyles();
        }

        function setPeriod(index) {
            const p = periods[index];
            const manualDiv = document.getElementById('manual-inputs');
            if (p.name === "Manual") {
                manualDiv.style.display = 'block';
                activeStartTime = document.getElementById("manual-start").value;
                activeEndTime = document.getElementById("manual-end").value;
                document.getElementById('display-start').innerText = setTodayWithTimeString(activeStartTime).toLocaleTimeString('en-US', {
                    hour: 'numeric',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                });
                document.getElementById('display-end').innerText = setTodayWithTimeString(activeEndTime).toLocaleTimeString('en-US', {
                    hour: 'numeric',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                });
            } else {
                manualDiv.style.display = 'none';
                activeStartTime = p.start;
                activeEndTime = p.end;
                document.getElementById('display-start').innerText = p.start;
                document.getElementById('display-end').innerText = p.end;
            }
            saveSettings();
        }

        function updateContent() {
            document.getElementById('paper').innerText = document.getElementById('set-paper-text').value;
            document.getElementById('online').innerText = document.getElementById('set-online-text').value;
            saveSettings();
        }

        function updateStyles() {
            const color = document.getElementById('set-color').value;
            const opacity = document.getElementById('set-opacity').value;
            const textColor = document.getElementById('set-text-color').value;
            const font = document.getElementById('set-font').value;
            const logoUrl = document.getElementById('set-logo-url').value;
            const logoOpacity = document.getElementById('logo-opacity').value;
            const newSize = document.getElementById('set-size').value;


            const r = parseInt(color.slice(1, 3), 16);
            const g = parseInt(color.slice(3, 5), 16);
            const b = parseInt(color.slice(5, 7), 16);
            document.getElementById('bg-overlay').style.backgroundColor = `rgba(${r},${g},${b},${opacity})`;
            document.body.style.fontFamily = font;
            document.body.style.color = textColor;
            document.documentElement.style.setProperty('--font-base-size', newSize);

            const logoImg = document.getElementById('background-logo');
            if (logoUrl) {
                logoImg.src = logoUrl;
                logoImg.style.display = 'block';
                logoImg.style.width = '100vw'; logoImg.style.height = '100vh';
                logoImg.style.opacity = logoOpacity;
            } else {
                logoImg.style.display = 'none';
            }
            saveSettings();
            fillContainer(document.getElementById('paper'));
            fillContainer(document.getElementById('online'));
        }

        function setTodayWithTimeString(timeStr) {
            // Create a new Date object representing right now
            const date = new Date();

            // Split the string into time components and the AM/PM marker
            const [time, modifier] = timeStr.split(' ');

            // Extract hours, minutes, and seconds as numbers
            let [hours, minutes, seconds] = time.split(':').map(Number);

            // Convert 12-hour format to 24-hour format
            if (modifier === 'PM' && hours < 12) {
                hours += 12;
            }
            if (modifier === 'AM' && hours === 12) {
                hours = 0;
            }

            // Update the time components on today's date object
            date.setHours(hours, minutes, seconds, 0);

            return date;
        }

        function updateTimer() {
            if (document.getElementById('p10')?.checked) {
                document.getElementById('display-start').innerText = setTodayWithTimeString(activeStartTime).toLocaleTimeString('en-US', {
                    hour: 'numeric',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                });
                document.getElementById('display-end').innerText = setTodayWithTimeString(activeEndTime).toLocaleTimeString('en-US', {
                    hour: 'numeric',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                });
                activeStartTime = document.getElementById('manual-start').value;
                activeEndTime = document.getElementById('manual-end').value;
                if (activeStartTime?.length === 5) activeStartTime += ":00";
                if (activeEndTime?.length === 5) activeEndTime += ":00";
            }

            if (!activeStartTime || !activeEndTime) return "00:00:00";

            const now = new Date();
            const todayStr = now.toISOString().split('T');
            const timeOnly = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
            //const start = new Date(`${todayStr}T${activeStartTime}`);
            //const end = new Date(`${todayStr}T${activeEndTime}`);
            const start = setTodayWithTimeString(activeStartTime)
            const end = setTodayWithTimeString(activeEndTime)

            document.getElementById('display-current').innerText = timeOnly;
            //alert(activeStartTime);

            let diff = (end - now) / 1000;
            if (now < start) diff = (end - start) / 1000;
            if (now > end) diff = 0;

            if (diff <= 120 && diff > 0) {
                const h = Math.floor(diff / 3600).toString().padStart(2, '0');
                const m = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
                const s = Math.floor(diff % 60).toString().padStart(2, '0');
                document.getElementById('display-remain').innerText = `${h}:${m}:${s}`;
            } else {
                const h = Math.floor(diff / 3600).toString().padStart(2, '0');
                const m = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
                const s = Math.floor(diff % 60).toString().padStart(2, '0');
                document.getElementById('display-remain').innerText = `${h}:${m}`;
            }
        }

        function fillContainer(div) {
            let fontSize = 10; // Start small
            div.style.fontSize = fontSize + 'px';

            // Increase font size until it overflows either width or height
            while (
                div.scrollWidth <= div.clientWidth &&
                div.scrollHeight <= div.clientHeight &&
                fontSize < 500 // Safety cap
            ) {
                fontSize++;
                div.style.fontSize = fontSize + 'px';
            }

            // Step back one pixel to fit cleanly without overflowing
            div.style.fontSize = (fontSize - 1) + 'px';
        }

        function saveSettings() {
            const config = {
                paperText: document.getElementById('set-paper-text').value,
                onlineText: document.getElementById('set-online-text').value,
                color: document.getElementById('set-color').value,
                opacity: document.getElementById('set-opacity').value,
                textColor: document.getElementById('set-text-color').value,
                font: document.getElementById('set-font').value,
                size: document.getElementById('set-size').value,
                logoUrl: document.getElementById('set-logo-url').value,
                logoOpacity: document.getElementById('logo-opacity').value,
                periodIdx: document.querySelector('input[name="period"]:checked')?.value,
                mStart: document.getElementById('manual-start').value,
                mEnd: document.getElementById('manual-end').value
            };
            localStorage.setItem('timerSettingsV3', JSON.stringify(config));
        }

        function loadSettings() {
            const data = localStorage.getItem('timerSettingsV3');
            if (!data) {
                document.getElementById('set-color').value = "#4cbb17";
                updateStyles();
                return;
            }
            const c = JSON.parse(data);
            document.getElementById('set-paper-text').value = c.paperText || "";
            document.getElementById('set-online-text').value = c.onlineText || "";
            document.getElementById('set-color').value = c.color || "#4cbb17";
            document.getElementById('set-opacity').value = c.opacity || 0.7;
            document.getElementById('set-text-color').value = c.textColor || "#ffffff";
            document.getElementById('set-font').value = c.font || "sans-serif";
            document.getElementById('set-size').value = c.size || "2vw";
            document.getElementById('set-logo-url').value = c.logoUrl || "";
            document.getElementById('logo-opacity').value = c.logoOpacity || "0.5";
            document.getElementById('manual-start').value = c.mStart || "";
            document.getElementById('manual-end').value = c.mEnd || "";
            if (c.periodIdx !== undefined) {
                const rb = document.getElementById(`p${c.periodIdx}`);
                if (rb) { rb.checked = true; setPeriod(c.periodIdx); }
            }
            updateContent();
            updateStyles();
        }
    </script>
</body>

</html>
